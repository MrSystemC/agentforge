services:
  agentforge:
    build: .
    image: agentforge:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - .env
    ports:
      - "${PORT:-4173}:4173"
    volumes:
      - agentforge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agentforge-data:

services:
  agentforge:
    build: .
    image: agentforge:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-4173}:4173"
    volumes:
      - agentforge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agentforge-data:

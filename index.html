<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071116" />
    <meta name="description" content="AgentForge — рабочая среда для проектирования, проверки и запуска AI-агентов." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.openai.com; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
    <title>AgentForge — рабочая среда AI-агентов</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Основная навигация">
        <div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>AgentForge</strong><small>agent control plane</small></div></div>
        <button class="workspace-switcher" data-action="workspace-menu" type="button"><span class="workspace-avatar">M</span><span class="workspace-copy"><small>Рабочее пространство</small><strong id="workspaceName">Моя команда</strong></span><span class="chevron">⌄</span></button>
        <nav class="main-nav">
          <button class="nav-item active" data-view="studio" type="button"><span class="nav-icon">✦</span> Студия <b class="nav-count">0</b></button>
          <button class="nav-item" data-view="agents" type="button"><span class="nav-icon">◈</span> Мои агенты <b class="nav-count" id="agentNavCount">0</b></button>
          <button class="nav-item" data-view="templates" type="button"><span class="nav-icon">▦</span> Шаблоны</button>
          <button class="nav-item" data-view="runs" type="button"><span class="nav-icon">↯</span> Запуски <span class="status-dot"></span></button>
        </nav>
        <div class="nav-label">Быстрые действия</div>
        <div class="space-list">
          <button class="space-item" data-action="new-agent" type="button"><span class="space-color coral"></span> Новый агент</button>
          <button class="space-item" data-action="import-agent" type="button"><span class="space-color violet"></span> Импорт паспорта</button>
          <button class="space-item" data-view="docs" type="button"><span class="space-color mint"></span> Документация</button>
        </div>
        <div class="sidebar-bottom">
          <button class="nav-item" data-view="settings" type="button"><span class="nav-icon">⚙</span> Настройки</button>
          <div class="profile-card"><span class="profile-avatar">МК</span><span class="profile-copy"><strong>Mikle</strong><small>Pro workspace</small></span><span class="online-dot"></span></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span id="breadcrumbRoot">Студия</span><b>/</b><strong id="breadcrumbCurrent">Новый агент</strong></div>
          <div class="top-actions"><span class="connection-pill" id="connectionStatus"><i></i> Проверка системы</span><button class="ghost-button" data-action="save-draft" type="button"><span>●</span> Сохранить черновик</button><button class="avatar-button" data-view="settings" type="button">МК</button></div>
        </header>
        <div class="content-wrap" id="viewRoot" aria-live="polite"></div>
        <footer class="footer"><span>AgentForge <span id="footerVersion">v1.0.0</span></span><span><span class="footer-dot"></span> <span id="footerState">Система готова</span></span><span>Локальное управление данными</span></footer>
      </main>
    </div>

    <input id="contextFileInput" type="file" hidden multiple accept=".txt,.md,.json,.csv,.yaml,.yml,.xml" />
    <input id="passportFileInput" type="file" hidden accept=".json,.agentforge.json" />
    <div class="toast" id="toast" role="status"><span>✓</span><strong id="toastText"></strong></div>

    <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
      <section class="app-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header"><div><span class="eyebrow">AGENTFORGE ACTION</span><h2 id="modalTitle">Подтверждение</h2></div><button class="modal-close" data-action="close-modal" type="button" aria-label="Закрыть">×</button></div>
        <div id="modalBody"></div>
      </section>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
